[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyside6dom"
version = "0.1.7"
authors = [
  { name="Christopher Andrew Topalian" }
]
description = "A web-style Document Object Model (DOM) interface for building PySide6 desktop applications."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: User Interfaces",
    "Intended Audience :: Education",
]
dependencies = [
    "PySide6>=6.0.0"
]

[project.urls]
"Homepage" = "https://github.com/ChristopherAndrewTopalian/pyside6dom"

[tool.setuptools]
packages = ["pyside6dom"]